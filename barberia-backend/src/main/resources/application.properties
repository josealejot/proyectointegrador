spring.application.name=Barberia
server.port=8080

# Conexion a MySQL (XAMPP). La base de datos se crea sola si no existe.
spring.datasource.url=jdbc:mysql://localhost:3306/barberia?createDatabaseIfNotExist=true&serverTimezone=America/Bogota
spring.datasource.username=root
spring.datasource.password=
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false

# Las respuestas de error no muestran detalles internos del servidor
server.error.include-stacktrace=never

# Swagger
springdoc.api-docs.enabled=true
springdoc.swagger-ui.enabled=true
springdoc.swagger-ui.path=/doc/swagger-ui.html
